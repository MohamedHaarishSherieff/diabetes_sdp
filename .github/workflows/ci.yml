name: Diabetes Prediction CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install Flask==3.1.3 joblib==1.5.3 numpy==2.4.0 scikit-learn==1.8.0

    - name: Validate Flask App
      run: |
        python -m py_compile app.py
        python -c "from app import app; print('App imported successfully')"